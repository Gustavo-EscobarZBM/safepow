name: safepow-web

services:
  web:
    build: .
    image: safepow-web:local
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://safepow-api:3000/api}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-inv_saas_session}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    networks:
      - clients
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  clients:
    external: true
    name: safepow-local
